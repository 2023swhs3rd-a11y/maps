name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 매주 월요일 03:17 UTC(한국 12:17)에 작품·장소 정보를 새로 받아 다시 배포합니다
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # TMDB·TourAPI에서 작품·장소 정보를 받아옵니다. 키(Secrets)가 없으면 건너뜁니다.
      - name: Enrich data from TMDB and TourAPI
        run: npm run enrich
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TOURAPI_KEY: ${{ secrets.TOURAPI_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
